# nginx config for the CampusMate frontend container.
# Serves the built SPA and proxies /api to the backend service so the browser
# only ever talks to one origin.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any unknown path serves index.html for client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API + source-document requests to the FastAPI backend.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 25m;
    }
}
